<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="音声Notion" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}" />
  <title>音声入力 → Notion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=12" />
</head>
<body>
  <main class="wrap">
    <h1>音声入力 → Notion</h1>
    <p class="sub">ボタンを押して話し、もう一度押すと文字になります。パソコンの電源は不要です。</p>

    <p id="phone-help" class="banner warn hidden" role="status"></p>
    <p id="homescreen-hint" class="banner hint-banner">パスワードは一度保存すれば、このスマホでは次回から不要です。ホーム画面のアイコンは、同じページを開く近道です。</p>

    {% if secret_required %}
    <details id="secret-box" class="secret-box">
      <summary>接続用パスワード</summary>
      <p class="secret-help">Render で決めた接続用パスワードです。一度保存すれば、タブを閉じてもこのスマホに残ります。</p>
      <label class="label" for="remote-secret">パスワード</label>
      <input id="remote-secret" type="password" name="voice-shared-secret" autocomplete="off" />
      <button id="secret-save" type="button" class="btn btn-secondary">この端末に保存</button>
    </details>
    {% endif %}

    <button id="mic-btn" type="button" class="btn btn-mic" aria-pressed="false">
      🎤 音声入力開始
    </button>
    <p id="listening" class="listening hidden" aria-live="polite">🎙 音声入力中…</p>

    <label class="label" for="transcript">認識した内容</label>
    <textarea id="transcript" rows="8" placeholder="例：明日の午前中に牛舎の薬品在庫を確認する"></textarea>

    <button id="submit-btn" type="button" class="btn btn-submit">Notionに登録</button>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}?v=12"></script>
</body>
</html>
