<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Notion ソース Q&amp;A</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --accent: #5b9cf5;
      --danger: #f07178;
      --ok: #7fd99a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --card: #fff;
        --text: #1c2530;
        --muted: #5c6b7a;
        --accent: #2563eb;
        --danger: #dc2626;
        --ok: #15803d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; font-weight: 650; }
    .sub { margin: 0 0 1rem; color: var(--muted); font-size: 0.88rem; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 1rem 1rem 1.1rem;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 0.35rem; }
    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid rgba(127,127,127,.25);
      padding: 0.65rem 0.75rem;
      font-size: 1rem;
      background: transparent;
      color: inherit;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
      align-items: center;
    }
    .row label.inline { display: flex; align-items: center; gap: 0.4rem; font-size: 0.86rem; color: var(--text); margin: 0; cursor: pointer; }
    button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: rgba(127,127,127,.35); color: var(--text); }
    .status {
      margin-top: 0.85rem;
      font-size: 0.88rem;
      color: var(--muted);
      min-height: 1.5em;
      white-space: pre-wrap;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .answer {
      margin-top: 1rem;
      padding: 0.85rem 0.95rem;
      border-radius: 12px;
      background: rgba(127,127,127,.1);
      font-size: 0.92rem;
      white-space: pre-wrap;
    }
    .sources { margin-top: 0.85rem; font-size: 0.82rem; color: var(--muted); }
    .sources a { color: var(--accent); }
    .hint { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }
    code { font-size: 0.85em; }
    details {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(127,127,127,.12);
      font-size: 0.88rem;
    }
    details summary { cursor: pointer; font-weight: 600; color: var(--text); }
    details .body { margin-top: 0.6rem; color: var(--muted); line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Notion ソース Q&amp;A</h1>
    <p class="sub">別データベース（<code>NOTION_KB_DATABASE_ID</code>）の行と本文をソースに、根拠のある回答を生成します。</p>
    <div class="card">
      <label for="q">質問</label>
      <textarea id="q" placeholder="例：このナレッジに〇〇について何と書いてありますか？"></textarea>
      <div class="row">
        <button type="button" id="ask">質問する</button>
        <label class="inline"><input type="checkbox" id="refresh" /> インデックス再構築（Notion を再取得）</label>
      </div>
      <div class="status" id="st" role="status" aria-live="polite"></div>
      <div class="answer" id="ans" hidden></div>
      <div class="sources" id="src" hidden></div>
    </div>
    <p class="hint"><a href="/">音声転記</a> ・ <a href="/idea-city">Idea City</a> ・ ローカル例 <code>http://127.0.0.1:8765/notebook</code></p>
    <details>
      <summary>必要な環境変数</summary>
      <div class="body">
        <code>NOTION_API_KEY</code>、<code>NOTION_KB_DATABASE_ID</code>（タスク用 DB とは別）、<code>OPENAI_API_KEY</code>。
        デプロイで <code>VOICE_SHARED_SECRET</code> を使っている場合、この画面も同じパスワードを保存済みである必要があります。
      </div>
    </details>
  </main>
  <script>
    const qEl = document.getElementById("q");
    const st = document.getElementById("st");
    const ans = document.getElementById("ans");
    const src = document.getElementById("src");
    const btn = document.getElementById("ask");
    const refreshEl = document.getElementById("refresh");
    const VOICE_SECRET_KEY = "voiceSharedSecret";

    function setStatus(msg, cls) {
      st.textContent = msg || "";
      st.className = "status" + (cls ? " " + cls : "");
    }

    function headers() {
      const h = { "Content-Type": "application/json" };
      const s = sessionStorage.getItem(VOICE_SECRET_KEY);
      if (s) h["X-Voice-Secret"] = s;
      return h;
    }

    btn.addEventListener("click", async () => {
      const question = (qEl.value || "").trim();
      if (!question) {
        setStatus("質問を入力してください。", "err");
        return;
      }
      btn.disabled = true;
      ans.hidden = true;
      src.hidden = true;
      setStatus("考え中…（初回は Notion 取得と埋め込みに時間がかかります）", "busy");
      try {
        const res = await fetch("/api/notebook/ask", {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({ question, refresh: Boolean(refreshEl.checked) }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setStatus(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : "エラー (" + res.status + ")", "err");
          return;
        }
        setStatus("完了（チャンク " + (data.chunks_used || 0) + " 件を参照）", "ok");
        ans.textContent = data.answer || "";
        ans.hidden = false;
        const list = Array.isArray(data.sources) ? data.sources : [];
        if (list.length) {
          src.innerHTML = "<strong>参照したページ</strong><br />" + list.map(function (s) {
            const t = (s.title || "").replace(/</g, "&lt;");
            const u = s.url || "";
            if (u) return "・<a href=\"" + u.replace(/"/g, "&quot;") + "\" target=\"_blank\" rel=\"noopener noreferrer\">" + t + "</a>";
            return "・" + t;
          }).join("<br />");
          src.hidden = false;
        }
      } catch (e) {
        setStatus("通信エラー: " + (e && e.message ? e.message : e), "err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
