services:
  - type: web
    name: voice-notion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: VOICE_CLOUD
        value: "1"
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DB_6PON_ID
        sync: false
      - key: VOICE_SHARED_SECRET
        generateValue: true
